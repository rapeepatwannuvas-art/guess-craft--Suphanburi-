<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบจัดการหลังบ้าน | Guess Craft Backoffice</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- โหลด Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-dark: #0f172a;       
            --accent-gold: #d97706;     
            --accent-hover: #b45309; 
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #020617 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo-text { font-size: 26px; font-weight: 600; color: var(--primary-dark); display: block; line-height: 1.1; }
        .logo-subtext { font-size: 11px; font-weight: 500; letter-spacing: 2px; color: var(--accent-gold); text-transform: uppercase; }
        
        .login-header { margin: 30px 0; }
        .login-header h2 { font-size: 18px; color: var(--text-dark); margin-bottom: 5px; }
        .login-header p { font-size: 13px; color: #64748b; }

        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #475569; margin-bottom: 8px; }
        .form-group input {
            width: 100%; padding: 12px 15px;
            border: 1px solid #cbd5e1; border-radius: 8px;
            font-size: 14px; outline: none; transition: 0.3s;
        }
        .form-group input:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15); }

        .btn-login {
            width: 100%; background-color: var(--accent-gold); color: #fff;
            padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600;
            border: none; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-login:hover { background-color: var(--accent-hover); }
        .btn-login:disabled { background-color: #cbd5e1; cursor: not-allowed; }

        .error-message {
            color: #ef4444; font-size: 13px; margin-top: 15px; display: none;
            background-color: #fee2e2; padding: 10px; border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div>
            <span class="logo-text">GUESS CRAFT</span>
            <span class="logo-subtext">Backoffice System</span>
        </div>
        
        <div class="login-header">
            <h2>เข้าสู่ระบบ (Admin Login)</h2>
            <p>กรุณากรอกอีเมลและรหัสผ่านเพื่อจัดการระบบ</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>อีเมล (Email)</label>
                <input type="email" id="email" placeholder="admin@guesscraft.com" required>
            </div>
            <div class="form-group">
                <label>รหัสผ่าน (Password)</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <div id="errorMessage" class="error-message">อีเมลหรือรหัสผ่านไม่ถูกต้อง</div>
            
            <button type="submit" class="btn-login" id="loginBtn">เข้าสู่ระบบ</button>
        </form>
    </div>

    <script>
        // ==========================================
        // ตั้งค่า Supabase (เดี๋ยวเราเอา API Key มาใส่ตรงนี้)
        // ==========================================
        const SUPABASE_URL = 'https://vgixtsurzyrxybysgazc.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnaXh0c3VyenlyeHlieXNnYXpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNDczNDEsImV4cCI6MjEwMTgyMzM0MX0.0w267jpzh4ABrRDUwAwtjFU9fEyrTtkLwFvqoSKFuqI';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // จัดการเมื่อกดปุ่มเข้าสู่ระบบ
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');

            // โชว์สถานะกำลังโหลด
            loginBtn.innerText = 'กำลังตรวจสอบ...';
            loginBtn.disabled = true;
            errorMessage.style.display = 'none';

            // ยิงข้อมูลไปถาม Supabase
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                // ถ้ารหัสผิด
                errorMessage.style.display = 'block';
                errorMessage.innerText = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
                loginBtn.innerText = 'เข้าสู่ระบบ';
                loginBtn.disabled = false;
            } else {
                // ถ้ารหัสถูก พาไปหน้า admin.html ทันที
                window.location.href = 'admin.html';
            }
        });
    </script>
</body>
</html>
